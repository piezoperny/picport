{{ define "main" }}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

<style>
    #map { height: 85vh; width: 100%; background: #111; z-index: 1; margin-top: 0; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
        background: #221d35;
        color: #eee;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 10px;
    }
    .leaflet-popup-content { margin: 12px; min-width: 210px; text-align: left; }
    .popup-card { display: flex; flex-direction: column; gap: 8px; }
    .popup-thumb { width: 100%; max-width: 230px; height: auto; display: block; cursor: pointer; border-radius: 4px; }
    .popup-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .popup-collection {
        display: inline-block;
        font-family: 'Inter', sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: lowercase;
        color: #e9e4ff;
        background: rgba(155, 135, 245, 0.18);
        border: 1px solid rgba(155, 135, 245, 0.35);
        padding: 2px 8px;
        border-radius: 999px;
        text-decoration: none;
    }
    .popup-collection:hover { background: rgba(155, 135, 245, 0.3); }
    .popup-datetime { font-family: 'Inter', sans-serif; font-size: 0.7rem; color: #a3a0ac; }
    .popup-camera { font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; font-weight: 500; color: #fff; text-transform: lowercase; line-height: 1.2; }
    .popup-pills { display: flex; flex-wrap: wrap; gap: 4px; }
    .popup-pill {
        font-family: 'Inter', sans-serif;
        font-size: 0.68rem;
        color: #d8d4e8;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 2px 6px;
        border-radius: 4px;
        text-transform: lowercase;
    }
</style>

<div id="map"></div>

<script>
function parsePhotoMetadata(img) {
    const name = decodeURIComponent(img.name || (img.url ? img.url.split('/').pop() : ''));
    const parts = name.split('--');
    const base = parts[0] || '';

    let date = img.date || '';
    let time = img.time || '';
    if (!date) {
        const dtMatch = base.match(/^(\d{4})(\d{2})(\d{2})(?:_(\d{2})(\d{2}))?/);
        if (dtMatch) {
            date = `${dtMatch[1]}-${dtMatch[2]}-${dtMatch[3]}`;
            if (!time && dtMatch[4] && dtMatch[5]) {
                time = `${dtMatch[4]}:${dtMatch[5]}`;
            }
        }
    }

    let camera = img.camera || '';
    let iso = img.iso || '';
    let aperture = img.aperture || '';
    let shutter = img.shutter || '';

    if ((!camera || !iso || !aperture || !shutter) && base.length > 16) {
        const techRaw = base.substring(16);
        const techParts = techRaw.split('_');
        if (techParts.length >= 4) {
            const shutterRaw = techParts.pop();
            const apertureRaw = techParts.pop();
            const isoRaw = techParts.pop();
            camera = camera || techParts.join(' ').toLowerCase();
            iso = iso || `iso ${isoRaw}`.toLowerCase();
            aperture = aperture || `f/${apertureRaw}`.toLowerCase();
            shutter = shutter || `${shutterRaw.replace(/^1-/, '1/')} s`.toLowerCase();
        }
    }

    let collection = img.collection || '';
    let collectionUrl = img.collectionUrl || '';
    if (!collection && img.url) {
        const urlMatch = img.url.match(/\/gallery\/([^/]+)\//i);
        if (urlMatch) {
            const slug = decodeURIComponent(urlMatch[1]);
            collection = slug.replace(/-/g, ' ').toLowerCase();
            collectionUrl = `/gallery/${urlMatch[1]}/`;
        }
    }

    return { date, time, camera, iso, aperture, shutter, collection, collectionUrl };
}

document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('map').setView([46.0, 10.0], 4);
    
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: '&copy; <a href="https://www.esri.com/">Esri</a>, HERE, Garmin, FAO, NOAA, USGS, EPA',
        maxNativeZoom: 16,
        maxZoom: 19
    }).addTo(map);

    fetch('/index.json?v={{ .Site.Params.version | urlize }}')
        .then(response => response.json())
        .then(data => {
            const heatPoints = [];
            const photoMarkers = []; 
            const mapImageUrls = [];
            
            data.forEach(img => {
                const parts = img.name.split('--');
                if (parts.length > 1) {
                    let coordsRaw = parts[parts.length - 1].replace(/\.(jpg|jpeg|png|webp|gif)$/i, "");
                    const latLon = coordsRaw.split('_');
                    
                    if (latLon.length >= 2) {
                        const lat = parseFloat(latLon[0]);
                        const lon = parseFloat(latLon[1]);
                        
                        if (!isNaN(lat) && !isNaN(lon)) {
                            heatPoints.push([lat, lon, 1]); 
                            mapImageUrls.push(img.url);

                            const meta = parsePhotoMetadata(img);
                            const dateTimeStr = [meta.date, meta.time].filter(Boolean).join(' • ');
                            const pills = [meta.iso, meta.aperture, meta.shutter].filter(Boolean)
                                .map(p => `<span class="popup-pill">${p}</span>`).join('');
                            const collectionBadge = meta.collection
                                ? `<a href="${meta.collectionUrl || '#'}" class="popup-collection">${meta.collection}</a>`
                                : '';
                            const cameraLabel = meta.camera ? `📷 ${meta.camera}` : '';
                            
                            // Updated to a lilac that complements your #221d35 background
                            const marker = L.circleMarker([lat, lon], {
                                radius: Math.max(3.5, map.getZoom() * 0.7),
                                fillColor: '#9b87f5',
                                color: 'transparent',
                                weight: 15, 
                                fillOpacity: 0.8
                            });
                            
                            const popupHtml = `
                                <div class="popup-card">
                                    <img src="${img.url}" class="popup-thumb" onclick="openLightbox('${img.url}')" alt="${meta.camera || 'photo'}">
                                    <div class="popup-top">
                                        ${collectionBadge}
                                        ${dateTimeStr ? `<span class="popup-datetime">${dateTimeStr}</span>` : ''}
                                    </div>
                                    ${cameraLabel ? `<div class="popup-camera">${cameraLabel}</div>` : ''}
                                    ${pills ? `<div class="popup-pills">${pills}</div>` : ''}
                                </div>`;
                            marker.bindPopup(popupHtml);
                            marker.addTo(map);
                            photoMarkers.push(marker);
                        }
                    }
                }
            });
            window.lightboxImages = mapImageUrls;
            
            map.on('zoomend', function() {
                const newRadius = Math.max(3.5, map.getZoom() * 0.7);
                photoMarkers.forEach(m => m.setRadius(newRadius));
            });
            
            // Heatmap gradient transitions seamlessly into your dark mode CSS base
            L.heatLayer(heatPoints, {
                radius: 40,
                blur: 45,
                maxZoom: 12,
                maxOpacity: 0.35,
                gradient: {
                    0.4: '#221d35', // Your CSS dark background base
                    0.7: '#5b4a99', // Mid-tone purple
                    1.0: '#9b87f5'  // Bright lilac core
                }
            }).addTo(map);
        });
});
</script>
{{ end }}
