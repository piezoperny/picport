{{ define "main" }}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

<style>
    #map { height: 85vh; width: 100%; background: #111; z-index: 1; margin-top: 0; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #222; color: #eee; border: 1px solid #444; }
    .leaflet-popup-content { margin: 10px; text-align: center; }
    .popup-thumb { width: 100%; max-width: 200px; height: auto; display: block; margin-bottom: 8px; cursor: pointer; border-radius: 2px; }
    
    /* Inverts standard OSM tiles to create a dark map */
    .leaflet-tile-pane {
        filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
    }
</style>

<div id="map"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('map').setView([46.0, 10.0], 4);
    
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
    }).addTo(map);

    fetch('/index.json')
        .then(response => response.json())
        .then(data => {
            const heatPoints = [];
            
            data.forEach(img => {
                const parts = img.name.split('--');
                if (parts.length > 1) {
                    let coordsRaw = parts[parts.length - 1].replace(/\.(jpg|jpeg|png|webp|gif)$/i, "");
                    const latLon = coordsRaw.split('_');
                    
                    if (latLon.length >= 2) {
                        const lat = parseFloat(latLon[0]);
                        const lon = parseFloat(latLon[1]);
                        
                        if (!isNaN(lat) && !isNaN(lon)) {
                            heatPoints.push([lat, lon, 1]); 
                            
                            // Delicate, cute markers with a soft pink halo
                            const marker = L.circleMarker([lat, lon], {
                                radius: 4,
                                fillColor: '#ffffff',
                                color: '#f472b6', 
                                weight: 2,
                                opacity: 0.7,
                                fillOpacity: 1.0
                            });
                            
                            const popupHtml = `<div><img src="${img.url}" class="popup-thumb" onclick="openLightbox('${img.url}')"></div>`;
                            marker.bindPopup(popupHtml);
                            marker.addTo(map);
                        }
                    }
                }
            });
            
            // Soft, atmospheric blush heatmap
            L.heatLayer(heatPoints, {
                radius: 45,
                blur: 40,
                maxZoom: 10,
                maxOpacity: 0.5,
                gradient: {
                    0.4: '#701a75', // Deep plum base
                    0.6: '#db2777', // Vibrant pink
                    0.8: '#f472b6', // Soft pastel pink
                    1.0: '#fdf2f8'  // Delicate blush white
                }
            }).addTo(map);
        });
});
</script>
{{ end }}
