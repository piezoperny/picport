{{ define "main" }}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

<style>
    #map { height: 85vh; width: 100%; background: #111; z-index: 1; margin-top: 0; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #222; color: #eee; border: 1px solid #444; }
    .leaflet-popup-content { margin: 10px; text-align: center; }
    .popup-thumb { width: 100%; max-width: 200px; height: auto; display: block; margin-bottom: 8px; cursor: pointer; border-radius: 2px; }
</style>

<div id="map"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('map').setView([46.0, 10.0], 4);
    
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: '&copy; <a href="https://www.esri.com/">Esri</a>, HERE, Garmin, FAO, NOAA, USGS, EPA',
        maxNativeZoom: 16,
        maxZoom: 19
    }).addTo(map);

    fetch('/index.json')
        .then(response => response.json())
        .then(data => {
            const heatPoints = [];
            const photoMarkers = []; 
            
            data.forEach(img => {
                const parts = img.name.split('--');
                if (parts.length > 1) {
                    let coordsRaw = parts[parts.length - 1].replace(/\.(jpg|jpeg|png|webp|gif)$/i, "");
                    const latLon = coordsRaw.split('_');
                    
                    if (latLon.length >= 2) {
                        const lat = parseFloat(latLon[0]);
                        const lon = parseFloat(latLon[1]);
                        
                        if (!isNaN(lat) && !isNaN(lon)) {
                            heatPoints.push([lat, lon, 1]); 
                            
                            // Updated to a lilac that complements your #221d35 background
                            const marker = L.circleMarker([lat, lon], {
                                radius: Math.max(3.5, map.getZoom() * 0.7),
                                fillColor: '#9b87f5',
                                color: 'transparent',
                                weight: 15, 
                                fillOpacity: 0.8
                            });
                            
                            const popupHtml = `<div><img src="${img.url}" class="popup-thumb" onclick="openLightbox('${img.url}')"></div>`;
                            marker.bindPopup(popupHtml);
                            marker.addTo(map);
                            photoMarkers.push(marker);
                        }
                    }
                }
            });
            
            map.on('zoomend', function() {
                const newRadius = Math.max(3.5, map.getZoom() * 0.7);
                photoMarkers.forEach(m => m.setRadius(newRadius));
            });
            
            // Heatmap gradient transitions seamlessly into your dark mode CSS base
            L.heatLayer(heatPoints, {
                radius: 40,
                blur: 45,
                maxZoom: 12,
                maxOpacity: 0.35,
                gradient: {
                    0.4: '#221d35', // Your CSS dark background base
                    0.7: '#5b4a99', // Mid-tone purple
                    1.0: '#9b87f5'  // Bright lilac core
                }
            }).addTo(map);
        });
});
</script>
{{ end }}
